[pytest]
# Markers
#
# integration: the test needs live AWS. Building the SageMaker pipeline
#   definition is an ONLINE operation -- the SDK resolves the account, validates
#   the execution role against live IAM, and uploads step code to S3 -- so those
#   tests cannot run in offline CI. They are DESELECTED explicitly there
#   (-m "not integration") rather than left to decide for themselves based on
#   whether credentials happen to be present: a test that silently becomes a
#   live test when a runner has credentials is not an offline suite.
#
# Run offline:      pytest -m "not integration"
# Run integration:  pytest -m integration      (needs credentials and a Region)
markers =
    integration: requires live AWS credentials and a resolvable Region

# -ra reports every skip with its reason, so a newly-skipping test is visible in
# the log instead of hidden inside a green run. A skip is not a pass.
addopts = -ra
